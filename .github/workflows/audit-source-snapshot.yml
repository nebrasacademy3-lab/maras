name: Pinned integration source snapshot
on:
  push:
    branches: [audit/source-8b7e3ee]
    paths: [.github/workflows/audit-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect PostgreSQL clients without application data or credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-clients"
          docker run --rm -v "$RUNNER_TEMP/recovery-clients:/out" postgres:18 bash -euc '
            mkdir -p /out/bin /out/lib
            for tool in pg_dump pg_restore psql; do
              binary="/usr/lib/postgresql/18/bin/$tool"
              cp "$binary" /out/bin/
              ldd "$binary" | awk '\''/=> \/.* \(/ { print $3 }'\'' | while read -r library; do
                case "$library" in */libc.so.*|*/libm.so.*|*/libpthread.so.*|*/libdl.so.*|*/librt.so.*) continue ;; esac
                cp -L "$library" /out/lib/
              done
            done
            /out/bin/pg_dump --version > /out/version.txt
          '
          tar -czf "$RUNNER_TEMP/postgresql-clients.tar.gz" -C "$RUNNER_TEMP/recovery-clients" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql18-recovery-clients
          path: ${{ runner.temp }}/postgresql-clients.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
