name: Pinned integration source snapshot
on:
  push:
    branches: [audit/source-8b7e3ee]
    paths: [.github/workflows/audit-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8b7e3eefb9b8e134c63a117a2e9d1bf7883430a2
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8b7e3eefb9b8e134c63a117a2e9d1bf7883430a2'
          mkdir -p "$RUNNER_TEMP/source-evidence"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source-evidence/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-evidence/source-identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-source-8b7e3ee
          path: ${{ runner.temp }}/source-evidence/
          retention-days: 1
          if-no-files-found: error
