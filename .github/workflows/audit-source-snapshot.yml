name: Pinned integration source snapshot
on:
  push:
    branches: [audit/source-8b7e3ee]
    paths: [.github/workflows/audit-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1d08c5ca28cb54e87998ab643cc46d15263d4661
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Archive pinned source and exact dependency tree
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1d08c5ca28cb54e87998ab643cc46d15263d4661'
          mkdir -p "$RUNNER_TEMP/source-evidence"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source-evidence/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-evidence/source-identity.txt"
          npm ci --no-audit --no-fund
          tar -czf "$RUNNER_TEMP/source-evidence/dependencies.tar.gz" node_modules
          sha256sum package-lock.json "$RUNNER_TEMP/source-evidence/dependencies.tar.gz" > "$RUNNER_TEMP/source-evidence/dependency-checksums.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-source-deps-1d08c5c
          path: ${{ runner.temp }}/source-evidence/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
