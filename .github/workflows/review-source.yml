name: Review source snapshot
on:
  push:
    branches: [implement/plan-v7-20260916]
    paths: [.github/workflows/review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only committed source
        run: |
          mkdir -p "$RUNNER_TEMP/review-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/review-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/review-source/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-snapshot
          path: ${{ runner.temp }}/review-source/
          retention-days: 1
