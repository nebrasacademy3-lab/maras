name: Integration source review
on:
  push:
    branches: [integration/v7-on-main-20260919]
    paths: [.github/workflows/integration-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/reviewed-integration-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/reviewed-source-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-integration-source
          path: |
            ${{ runner.temp }}/reviewed-integration-source.tar.gz
            ${{ runner.temp }}/reviewed-source-commit.txt
          retention-days: 1
          if-no-files-found: error
