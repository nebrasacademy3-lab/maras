name: Integration source review
on:
  pull_request:
    paths:
      - .github/workflows/integration-source-review.yml
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Package tracked source only, without secrets or generated data
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.ts' '*.tsx' '*.mjs' '*.json' '*.sql' '*.sh' '*.yml' '*.css' '*.md' '*.example' 'Dockerfile' | tar --null -T - -czf "$RUNNER_TEMP/reviewed-integration-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/reviewed-source-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-integration-source
          path: |
            ${{ runner.temp }}/reviewed-integration-source.tar.gz
            ${{ runner.temp }}/reviewed-source-commit.txt
          retention-days: 1
          if-no-files-found: error
