name: Instructor source inspection
on:
  push:
    branches: [audit/instructor-runtime-20260922]
    paths: [.github/workflows/instructor-source-inspection.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Materialize reviewed source from pinned repair parent
        run: |
          set -euo pipefail
          cp repair/paged-renderer.delta.b64 "$RUNNER_TEMP/paged-delta.b64"
          git fetch origin fix/instructor-contract-access-20260922
          test "$(git rev-parse origin/fix/instructor-contract-access-20260922)" = 532fde32c5b995a788bb1e8de26cce075e2b5881
          git switch --detach origin/fix/instructor-contract-access-20260922
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          raw = gzip.decompress(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP']) / 'paged-delta.b64').read_text(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '442fcab743adf0884209f4c9595341c1e86a8d53cfe0d3afdccff36f9a1e0f0a'
          delta = json.loads(raw)
          assert delta['base'] == '532fde32c5b995a788bb1e8de26cce075e2b5881'
          assert len(delta['files']) == 9
          paths = []
          for entry in delta['files']:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'Dockerfile', '.github', 'lib', 'scripts', 'tests'}
              assert not path.is_symlink()
              if entry['before'] is None:
                  assert not path.exists()
                  old = b''
              else:
                  old = path.read_bytes()
                  assert hashlib.sha256(old).hexdigest() == entry['before'], str(path)
              text = old.decode('utf-8')
              for start, end, replacement in reversed(entry['ops']):
                  assert 0 <= start <= end <= len(text)
                  text = text[:start] + replacement + text[end:]
              output = text.encode('utf-8')
              assert hashlib.sha256(output).hexdigest() == entry['after'], str(path)
              if path.parts[0] == '.github':
                  continue
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(output)
              paths.append(str(path))
          assert len(paths) == 8
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          print('VERIFIED_PAGED_SOURCE_FILES', len(paths))
          PY
          git config user.name 'nebrasacademy3-lab'
          git config user.email '310756671+nebrasacademy3-lab@users.noreply.github.com'
          git commit -m 'fix(pdf): render contracts without browser namespace dependencies'
          git push origin HEAD:refs/heads/audit/paged-contract-ready-20260922
          git log -1 --format='PAGED_REPAIR_COMMIT=%H'
