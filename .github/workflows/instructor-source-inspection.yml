name: Instructor source inspection
on:
  push:
    branches: [audit/instructor-runtime-20260922]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export tracked source without credentials
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/maras-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instructor-source
          path: ${{ runner.temp }}/maras-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install exact dependencies in isolated runner
        run: npm ci --no-audit --no-fund
      - name: Export dependency tooling without environment or cache
        run: tar -czf "$RUNNER_TEMP/maras-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instructor-dependencies
          path: ${{ runner.temp }}/maras-dependencies.tar.gz
          retention-days: 1
