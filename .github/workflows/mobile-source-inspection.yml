name: Mobile source inspection
on:
  push:
    branches: [audit/mobile-readiness-20260922]
permissions:
  contents: read
concurrency:
  group: mobile-source-inspection
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      REVIEW_HEAD: d21c3d3c3ba2c503f027a9169fcbf885501f58d4
      EXPO_PUBLIC_STORE_MODE: reader
      EXPO_PUBLIC_READER_PREVIEW: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve isolated browser harness
        run: cp repair/reader-browser-check.mjs "$RUNNER_TEMP/reader-browser-check.mjs"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d21c3d3c3ba2c503f027a9169fcbf885501f58d4
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact browser and mobile dependencies
        run: |
          npm ci --no-audit --no-fund
          cd mobile && npm ci --no-audit --no-fund
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Export exact reader preview
        working-directory: mobile
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/reader-web"
      - name: Verify phone and tablet widths with large text and both themes
        run: |
          cp "$RUNNER_TEMP/reader-browser-check.mjs" scripts/qa-reader-temporary.mjs
          node scripts/qa-reader-temporary.mjs
      - name: Keep only synthetic screenshots and status evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reader-browser-acceptance
          path: ${{ runner.temp }}/reader-browser-evidence
          retention-days: 7
