name: Mobile source inspection
on:
  push:
    branches: [audit/mobile-readiness-20260922]
permissions:
  contents: read
concurrency:
  group: mobile-source-inspection
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cc0d2f9e5ac40b1b565359b4a0b228d40290b5b6
          persist-credentials: false
      - name: Export tracked source only
        run: |
          test "$(git rev-parse HEAD)" = cc0d2f9e5ac40b1b565359b4a0b228d40290b5b6
          git archive --format=tar.gz --output="$RUNNER_TEMP/mobile-review-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-review-source
          path: ${{ runner.temp }}/mobile-review-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked mobile dependencies without application credentials
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Export mobile dependency files only
        run: tar -czf "$RUNNER_TEMP/mobile-review-dependencies.tar.gz" mobile/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-review-dependencies
          path: ${{ runner.temp }}/mobile-review-dependencies.tar.gz
          retention-days: 1
