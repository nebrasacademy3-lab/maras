name: Mobile source inspection
on:
  push:
    branches: [audit/mobile-readiness-20260922]
permissions:
  contents: write
concurrency:
  group: mobile-repair-materialization
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preserve reviewed payload
        run: cp repair/support-downloads.delta.b64 "$RUNNER_TEMP/support-repair.b64"
      - name: Apply only hash-verified attachment corrections
        run: |
          set -euo pipefail
          git fetch origin fix/mobile-store-readiness-20260922
          test "$(git rev-parse origin/fix/mobile-store-readiness-20260922)" = 1017c744b15f4cb76ca8fd1be7b35118eda0235d
          git switch --detach origin/fix/mobile-store-readiness-20260922
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          encoded=(pathlib.Path(os.environ['RUNNER_TEMP'])/'support-repair.b64').read_text()
          assert len(encoded)==4620
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='cfd60d40bb23cda9cff46b64d7b3b0731b85757bf8544cfb1731a8530ff2295e'
          delta=json.loads(raw)
          assert delta['base']=='1017c744b15f4cb76ca8fd1be7b35118eda0235d'
          assert len(delta['files'])==4
          paths=[]
          for entry in delta['files']:
              path=pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert path.parts[0] in {'mobile','proxy.ts'}
              if entry['before'] is None:
                  assert not path.exists()
                  old=b''
              else:
                  old=path.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==entry['before'],str(path)
              text=old.decode('utf-8')
              for start,end,replacement in reversed(entry['ops']):
                  assert 0<=start<=end<=len(text)
                  text=text[:start]+replacement+text[end:]
              output=text.encode('utf-8')
              assert hashlib.sha256(output).hexdigest()==entry['after'],str(path)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(output)
              paths.append(str(path))
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          print('VERIFIED_SUPPORT_REPAIR_FILES',len(paths))
          PY
          git config user.name 'nebrasacademy3-lab'
          git config user.email '310756671+nebrasacademy3-lab@users.noreply.github.com'
          git commit -m 'fix(mobile): use bounded session-safe transport for support attachments'
          git push origin HEAD:refs/heads/audit/mobile-support-ready-20260922
          git log -1 --format='SUPPORT_REPAIR_COMMIT=%H'
