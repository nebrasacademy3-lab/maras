name: Mobile source inspection
on:
  push:
    branches: [audit/mobile-readiness-20260922]
permissions:
  contents: write
concurrency:
  group: mobile-repair-materialization
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preserve reviewed payload
        run: cp repair/content-report.delta.b64 "$RUNNER_TEMP/content-report.b64"
      - name: Apply only hash-verified source corrections
        run: |
          set -euo pipefail
          git fetch origin fix/mobile-store-readiness-20260922
          test "$(git rev-parse origin/fix/mobile-store-readiness-20260922)" = 2eb4f35bd0f9d2c0b4a9b6222b787c0c24f7e67c
          git switch --detach origin/fix/mobile-store-readiness-20260922
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          encoded=(pathlib.Path(os.environ['RUNNER_TEMP'])/'content-report.b64').read_text()
          assert len(encoded)==8904
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='ca3d4da50a72f46d8de530c4445e778724af75749d43dce01b960aa737ab334e'
          delta=json.loads(raw)
          assert delta['base']=='2eb4f35bd0f9d2c0b4a9b6222b787c0c24f7e67c'
          assert len(delta['files'])==10
          paths=[]
          for entry in delta['files']:
              path=pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert path.parts[0] in {'app','mobile','tests','docs'}
              if entry['before'] is None:
                  assert not path.exists()
                  old=b''
              else:
                  old=path.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==entry['before'],str(path)
              text=old.decode('utf-8')
              for start,end,replacement in reversed(entry['ops']):
                  assert 0<=start<=end<=len(text)
                  text=text[:start]+replacement+text[end:]
              output=text.encode('utf-8')
              assert hashlib.sha256(output).hexdigest()==entry['after'],str(path)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(output)
              paths.append(str(path))
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          print('VERIFIED_REPORT_REPAIR_FILES',len(paths))
          PY
          git config user.name 'nebrasacademy3-lab'
          git config user.email '310756671+nebrasacademy3-lab@users.noreply.github.com'
          git commit -m 'fix(mobile): add private in-app AI reporting and remove reader coupon promotion'
          git push origin HEAD:refs/heads/audit/mobile-reports-ready-20260922
          git log -1 --format='REPORT_REPAIR_COMMIT=%H'
