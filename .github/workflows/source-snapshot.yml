name: Isolated source snapshot
on:
  push:
    branches: [improve/learning-tools-20260915]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD -o /tmp/maras-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: maras-source
          path: /tmp/maras-source.tar
          retention-days: 1
