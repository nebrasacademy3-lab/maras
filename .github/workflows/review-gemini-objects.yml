name: Reviewed Gemini Git objects
on:
  push:
    branches: [audit/gemini-objects-20260919]
    paths: [.github/workflows/review-gemini-objects.yml]
permissions:
  contents: read
jobs:
  objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b83a859e7fba3e51e9d96177c14155c14fc348c1
          persist-credentials: false
      - name: Verify reviewed patch and create immutable objects only
        env:
          OBJECT_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'nebrasacademy3-lab/maras'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          expected_tree = '80940886a252fc51d44847cdf83a00e34ec67fa8'
          base_tree = '41b2828170e54b4cd4549d0e557b4e8b02828b01'
          chunks = ['9da1364990474fcfd89e2d4a209baf5896962bf6','e496263fd3e232d0947a8b91354aa4c289956d85','d9b3c2918e64ff2d0db21a3bafa5ddee1335fcac','17662c85aa122bc92856dc9ea49e0dc6c533ba44','a79e2ee8d5fa3b1c6cf0cf47122e7148859a1687']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
              raise RuntimeError('Redirect refused')
          opener = urllib.request.build_opener(NoRedirect)
          def request(path, data=None):
            assert path == 'git/trees' or path == 'git/blobs' or (path.startswith('git/blobs/') and path[10:] in chunks)
            body = None if data is None else json.dumps(data).encode()
            req = urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path, data=body, headers={'Authorization':'Bearer '+os.environ['OBJECT_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
            with opener.open(req, timeout=30) as response:
              raw = response.read(2_000_001)
              assert len(raw) <= 2_000_000
              return json.loads(raw)
          def git(*args, data=None):
            return subprocess.check_output(['git',*args], input=data)
          def blob_sha(data):
            return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert git('rev-parse','HEAD^{tree}').decode().strip() == base_tree
          parts = []
          for sha in chunks:
            result = request('git/blobs/'+sha)
            data = base64.b64decode(result['content'])
            assert blob_sha(data) == sha
            parts.append(data)
          packed = base64.b64decode(b''.join(parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '41ca9db4e8205a016fa7a64a215963103085e0e8c38e36779830d38cf439a832'
          patch = lzma.decompress(packed, memlimit=256*1024*1024)
          assert len(patch) == 116439
          git('apply','--index','--whitespace=error-all','-',data=patch)
          assert git('write-tree').decode().strip() == expected_tree
          paths = git('diff','--cached','--name-only','-z').decode().strip('\0').split('\0')
          assert len(paths) == 21
          entries = []
          for path in paths:
            record = git('ls-files','--stage','--',path).decode().split()
            mode, sha, stage = record[:3]
            assert mode == '100644' and stage == '0'
            data = git('show',':'+path)
            assert blob_sha(data) == sha
            result = request('git/blobs', {'content':base64.b64encode(data).decode(),'encoding':'base64'})
            assert result['sha'] == sha
            entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          tree = request('git/trees',{'base_tree':base_tree,'tree':entries})
          assert tree['sha'] == expected_tree
          result = {'baseCommit':'b83a859e7fba3e51e9d96177c14155c14fc348c1','baseTree':base_tree,'reviewedTree':expected_tree,'changedFiles':entries,'refsModified':False,'productionAccess':False}
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed-gemini'
          output.mkdir()
          (output/'manifest.json').write_text(json.dumps(result,indent=2))
          print('Verified immutable tree:', expected_tree, '; files:', len(entries), '; no refs updated')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-gemini-objects
          path: ${{ runner.temp }}/reviewed-gemini/manifest.json
          retention-days: 1
          if-no-files-found: error
