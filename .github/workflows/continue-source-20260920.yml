name: Pinned continuation source 9abf700
on:
  push:
    branches: [audit/continue-source-20260920]
    paths: [.github/workflows/continue-source-20260920.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9abf7008379b9a8721ad2bc534dbaa5d6d1ffbf3
          persist-credentials: false
      - name: Archive exactly the reviewed commit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          test "$(git rev-parse HEAD^{tree})" = 09e85d47b83e14e916ef2e82be08200332690710
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/export/source.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/export/commit.txt"
          cd "$RUNNER_TEMP/export"
          sha256sum source.tar.gz commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-source-9abf700
          path: ${{ runner.temp }}/export/
          retention-days: 2
          if-no-files-found: error
