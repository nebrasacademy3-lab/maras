name: Production public checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-readonly:
    name: Public HTTPS, health and access boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Read public production endpoints without credentials or mutations
        env:
          EXPECT_NEW_DISCOVERY: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: node scripts/qa-production-public.mjs
      - name: Keep status-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-public-check
          path: verification/production-public-check.json
          retention-days: 7
