name: Production public checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-readonly:
    name: Public HTTPS, health and access boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Read public production endpoints without credentials or mutations
        env:
          EXPECT_NEW_DISCOVERY: ${{ github.event_name == 'push' && 'true' || 'false' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdirSync, writeFileSync } from 'node:fs';
          const origin = 'https://marasalelm.com';
          const allowed = new Set([origin, 'https://www.marasalelm.com']);
          const checks = [];
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function read(path) {
            let url = new URL(path, origin);
            assert.ok(allowed.has(url.origin) && !url.username && !url.password);
            for (let redirects = 0; redirects < 4; redirects++) {
              const response = await fetch(url, { method: 'GET', redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(15000), headers: { 'user-agent': 'Maras-ReadOnly-Release-Check/1.0', 'cache-control': 'no-cache' } });
              if ([301, 302, 303, 307, 308].includes(response.status)) {
                const location = response.headers.get('location');
                await response.body?.cancel();
                assert.ok(location, 'redirect requires a destination');
                url = new URL(location, url);
                assert.ok(allowed.has(url.origin) && !url.username && !url.password, 'redirect must stay on authorized HTTPS origins');
                continue;
              }
              const chunks = []; let total = 0;
              if (response.body) {
                const reader = response.body.getReader();
                try {
                  for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    total += value.byteLength;
                    if (total > 2 * 1024 * 1024) { await reader.cancel(); throw new Error('public response exceeds diagnostic bound'); }
                    chunks.push(value);
                  }
                } finally { reader.releaseLock(); }
              }
              return { status: response.status, headers: response.headers, text: Buffer.concat(chunks).toString('utf8') };
            }
            throw new Error('too many redirects');
          }
          function record(path, result, assertion) {
            assertion(result);
            checks.push({ path, status: result.status, passed: true });
          }
          try {
            if (process.env.EXPECT_NEW_DISCOVERY === 'true') {
              let deployed = false;
              for (let attempt = 0; attempt < 60; attempt++) {
                try {
                  const result = await read('/llms.txt');
                  if (result.status === 200 && result.text.includes('خريطة الموقع العامة الكاملة') && result.headers.get('cache-control') === 'no-store' && result.headers.get('x-permitted-cross-domain-policies') === 'none') { deployed = true; break; }
                } catch { /* A brief rollout failure must not expose internal response bodies. */ }
                await wait(10000);
              }
              assert.ok(deployed, 'new public discovery was not observed within the release verification window');
            }
            record('/api/health', await read('/api/health'), result => {
              assert.equal(result.status, 200, 'production readiness HTTP status');
              const health = JSON.parse(result.text);
              assert.equal(health.ok, true, 'production readiness');
              assert.equal(health.readiness?.database, 'ready');
              assert.equal(health.readiness?.storage, 'ready');
              assert.match(result.headers.get('cache-control') || '', /no-store/);
            });
            await wait(500);
            record('/', await read('/'), result => {
              assert.equal(result.status, 200);
              assert.match(result.text, /<html[^>]*lang="ar"/);
              assert.match(result.text, /<link[^>]*rel="canonical"[^>]*href="https:\/\/marasalelm\.com\//);
              assert.match(result.headers.get('content-security-policy') || '', /object-src 'none'/);
              assert.equal(result.headers.get('x-content-type-options'), 'nosniff');
              assert.match(result.headers.get('strict-transport-security') || '', /max-age=/);
            });
            await wait(500);
            record('/robots.txt', await read('/robots.txt'), result => {
              assert.equal(result.status, 200);
              assert.match(result.text, /Disallow:\s*\/api\//i);
              assert.match(result.text, /Allow:\s*\/api\/covers\//i);
              assert.match(result.text, /Sitemap:\s*https:\/\/marasalelm\.com\/sitemap\.xml/i);
            });
            await wait(500);
            record('/sitemap.xml', await read('/sitemap.xml'), result => {
              assert.equal(result.status, 200);
              const locations = [...result.text.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => match[1]);
              assert.ok(locations.length > 0, 'sitemap contains public entries');
              assert.equal(new Set(locations).size, locations.length, 'sitemap duplicates');
              for (const location of locations) {
                const url = new URL(location);
                assert.equal(url.origin, origin);
                assert.ok(!url.search && !url.hash);
                assert.doesNotMatch(url.pathname, /^\/(?:api|admin|supervisor|dashboard|learn|study-tools|checkout|invoices|profile)(?:\/|$)/);
              }
            });
            await wait(500);
            record('/llms.txt', await read('/llms.txt'), result => {
              assert.equal(result.status, 200);
              assert.match(result.headers.get('content-type') || '', /text\/plain/);
              assert.ok(result.text.includes('مراس العلم'));
              assert.doesNotMatch(result.text, /https:\/\/(?:www\.)?marasalelm\.com\/(?:api|admin|dashboard|learn|invoices)\//);
            });
            await wait(500);
            record('/api/admin/staff', await read('/api/admin/staff'), result => {
              assert.ok([401, 403].includes(result.status), 'anonymous staff access is rejected');
              assert.match(result.headers.get('cache-control') || '', /no-store/);
              assert.match(result.headers.get('x-robots-tag') || '', /noindex/);
            });
            console.log(JSON.stringify({ checkedAt: new Date().toISOString(), mode: 'anonymous GET only; no load test or live transactions', newDiscoveryRequired: process.env.EXPECT_NEW_DISCOVERY === 'true', checks }, null, 2));
          } finally {
            mkdirSync('verification', { recursive: true });
            writeFileSync('verification/production-public-check.json', JSON.stringify({ checkedAt: new Date().toISOString(), expectedNewDiscovery: process.env.EXPECT_NEW_DISCOVERY === 'true', checks }, null, 2));
          }
          NODE
      - name: Keep status-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-public-check
          path: verification/production-public-check.json
          retention-days: 7
