# Temporary source-authoring adapter only. Does not test, publish or update a branch.
name: Stage reviewed video settings
on:
  push:
    branches: [implement/plan-v7-20260916]
    paths: [.github/workflows/stage-media-source.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'nebrasacademy3-lab/maras'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 464f0e275e00a3874c5c3f1619c8d2b718536749
          persist-credentials: false
      - name: Materialize exact reviewed source and write unreferenced blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('Redirects forbidden')
          opener = urllib.request.build_opener(NoRedirect())
          def git_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          replacement = '''      {settings && <div className="player-settings" role="region" aria-label="إعدادات المشاهدة">
                  <div><Settings size={16} /><strong>إعدادات المشاهدة</strong><button type="button" aria-label="إغلاق إعدادات المشاهدة" onClick={() => setSettings(false)}>×</button></div>
                  <fieldset className="player-setting-group"><legend>السرعة</legend><span>
                    {[.5,.75,1,1.25,1.5,2].map((value) => <button type="button" key={value} aria-pressed={rate === value} className={rate === value ? "active" : ""} onClick={() => changeRate(value)}>{rate === value && <Check size={11} aria-hidden="true" />}{value}×</button>)}
                  </span></fieldset>
                  <fieldset className="player-setting-group"><legend>الجودة</legend><span>
                    {Object.keys(qualitySources).map((value) => <button type="button" key={value} aria-pressed={quality === value} className={quality === value ? "active" : ""} onClick={() => changeQuality(value)}>{quality === value && <Check size={11} aria-hidden="true" />}{value}</button>)}
                  </span></fieldset>
                  <p><ShieldCheck size={14} /> عند توفر البث المتكيف يختار المشغل أفضل جودة للاتصال تلقائيًا، مع بقاء الفيديو الأصلي خيارًا احتياطيًا.</p>
                </div>}'''
          # Remove YAML/Python continuation indentation, preserving reviewed JSX indentation.
          replacement = '\n'.join([replacement.splitlines()[0]] + [line[10:] for line in replacement.splitlines()[1:]])
          css = '''/* A fieldset names a group without relabelling its first button as a <label> does. */
          .secure-player .player-setting-group { min-width: 0; margin: 11px 0 0; padding: 0; border: 0; }
          .secure-player .player-setting-group legend { padding: 0; color: #9fb0cf; font-size: calc(10px * var(--font-scale, 1)); }
          .secure-player .player-setting-group > span { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
          .secure-player .player-setting-group button { min-height: 32px; display: flex; align-items: center; gap: 3px; padding: 0 8px; border: 1px solid rgba(255,255,255,.18); border-radius: 7px; color: #dbe5f7; background: rgba(255,255,255,.05); font-size: calc(10px * var(--font-scale, 1)); cursor: pointer; }
          .secure-player .player-setting-group button[aria-pressed="true"] { border-color: #4d82ff; color: #fff; background: #275ac8; }'''
          cases = [
              ('components/secure-video-player.tsx', '24a03032a757d2a2ca32fb40a657257e72349d77', '536dfff597223fd6f998b591517bf21e1d7221ec', replacement),
              ('components/secure-video-player.css', '0f0086c5f238123f9abed27817903ac301654bc8', '791d10a1d3aca5a384a02072b04e6a54db48a9a9', css),
          ]
          results = []
          for path, before_hash, after_hash, after in cases:
              before = pathlib.Path(path).read_bytes()
              assert git_hash(before) == before_hash
              text = before.decode('utf8')
              old = next(line for line in text.splitlines() if '{settings && <div className="player-settings"' in line) if path.endswith('.tsx') else '.secure-player .player-settings label button { min-height: 32px; }'
              assert text.count(old) == 1
              data = text.replace(old, after).encode('utf8')
              assert git_hash(data) == after_hash, path
              request = urllib.request.Request('https://api.github.com/repos/nebrasacademy3-lab/maras/git/blobs', data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json', 'User-Agent': 'Maras-reviewed-source-authoring'})
              with opener.open(request, timeout=30) as response:
                  created = json.load(response)
              assert created['sha'] == after_hash
              results.append({'path': path, 'sha': after_hash})
          print('REVIEWED_BLOBS', json.dumps(results))
          PY
