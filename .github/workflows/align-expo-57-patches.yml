name: Align reviewed Expo 57 patches
on:
  push:
    branches: [implement/plan-v7-20260916]
    paths: [.github/workflows/align-expo-57-patches.yml]
permissions:
  contents: write
concurrency:
  group: align-reviewed-expo-57
  cancel-in-progress: false
jobs:
  align:
    if: github.repository == 'nebrasacademy3-lab/maras' && github.ref == 'refs/heads/implement/plan-v7-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://maras-qa.example
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install current locked dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Align within the installed SDK major only
        working-directory: mobile
        run: |
          npm install 'expo@~57.0.23' --no-audit --no-fund
          npx expo install --fix
          npx expo install --check
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package.json","utf8")); if(!/^~?57\./.test(p.dependencies.expo)) throw Error("Unexpected SDK major change");'
      - name: Verify application after dependency alignment
        working-directory: mobile
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Persist manifests only and remove this temporary source editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const changed=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set(['mobile/package.json','mobile/package-lock.json']);
          if(changed.some(path=>!allowed.has(path))) throw Error('Unexpected source changes outside reviewed manifests');
          NODE
          git add mobile/package.json mobile/package-lock.json
          git rm .github/workflows/align-expo-57-patches.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align Expo 57 supported patches and regenerate verified native lockfile'
          gh auth setup-git
          git push origin HEAD:refs/heads/implement/plan-v7-20260916
