name: Reviewed stable targets
on:
  push:
    branches: [integration/v7-on-main-20260919]
    paths: [.github/workflows/review-stable-targets.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify literal edits and hashes; create objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess, urllib.request
          encoded = ''
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded, validate=True))) as stream:
              raw = stream.read(30001)
          assert len(raw) == 22404 and hashlib.sha256(raw).hexdigest() == 'b5f3c077ea159d54d6024c2d585119d0556fef4846a2f53de2d581408c7fa0c0'
          m = json.loads(raw)
          assert m['base'] == '78d928e3d7406a2b9652b6a00965ec3392de204b'
          assert m['baseTree'] == '5b1c596c75adc69de7f8b3b2529614555628ffed' and m['tree'] == '1dd97cd009464d3248ce420a65ab8f477be3822b'
          allowed = {'app/api/admin/console/route.ts','app/api/admin/support/metrics/route.ts','components/admin-dashboard.tsx','components/student-360.tsx','lib/supervisor-console-policy.ts','mobile/src/components/admin-student-actions.tsx','scripts/qa-admin-security.mjs','scripts/qa-admin-stable-ownership.ts','scripts/qa-supervisor-data-scope.ts','tests/admin-operations-behavior.test.mjs','tests/admin-reader-ownership-contract.test.mjs','tests/admin-stable-ownership-behavior.test.mjs'}
          assert len(m['files']) == 12 and {f['path'] for f in m['files']} == allowed
          subprocess.run(['git','merge-base','--is-ancestor',m['base'],'HEAD'],check=True)
          subprocess.run(['git','read-tree','--reset','-u',m['base']],check=True)
          for f in m['files']:
              p=pathlib.Path(f['path']); old=p.read_bytes()
              assert not p.is_symlink() and hashlib.sha256(old).hexdigest() == f['before']
              lines=old.decode().splitlines(keepends=True)
              for h in reversed(f['hunks']):
                  assert 0 <= h['start'] <= h['end'] <= len(lines)
                  lines[h['start']:h['end']]=h['lines']
              new=''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == f['after']
              p.write_bytes(new)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == m['tree']
          def post(endpoint,payload):
              assert endpoint in ('blobs','trees')
              req=urllib.request.Request('https://api.github.com/repos/nebrasacademy3-lab/maras/git/'+endpoint,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          entries=[]
          for f in m['files']:
              content=pathlib.Path(f['path']).read_bytes()
              sha=post('blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})['sha']
              assert sha == subprocess.check_output(['git','hash-object',f['path']],text=True).strip()
              entries.append({'path':f['path'],'mode':'100644','type':'blob','sha':sha})
          tree=post('trees',{'base_tree':m['baseTree'],'tree':entries})['sha']
          assert tree == m['tree']
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'stable-target-review'; evidence.mkdir()
          (evidence/'manifest.json').write_bytes(raw)
          (evidence/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached',m['base'],'--']))
          (evidence/'tree.json').write_text(json.dumps({'tree':tree,'files':entries,'updatedRefs':False},indent=2))
          print('VERIFIED_UNATTACHED_TREE',tree)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-stable-targets
          path: ${{ runner.temp }}/stable-target-review/
          retention-days: 3
          if-no-files-found: error
