name: Isolated source audit bundle
on:
  push:
    branches: [audit/runtime-security-20260917]
    paths: [.github/workflows/source-audit-bundle.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/source-audit"
          git archive --format=tar HEAD > "$RUNNER_TEMP/source-audit/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/source-audit/commit.txt"
          sha256sum "$RUNNER_TEMP/source-audit/source.tar" > "$RUNNER_TEMP/source-audit/checksum.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-source-audit
          path: ${{ runner.temp }}/source-audit/
          retention-days: 1
