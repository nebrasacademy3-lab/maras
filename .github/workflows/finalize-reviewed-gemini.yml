name: Finalize reviewed Gemini source objects
on:
  push:
    branches: [audit/finalize-gemini-20260919]
permissions:
  contents: write
jobs:
  reviewed-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: transport
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5acf06330db2b6ce83f301ce7b22d50c7dd2c37b
          persist-credentials: false
          path: source
      - name: Verify recovered patch and exact final source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          pieces = ''.join(pathlib.Path(f'transport/.audit-refresh/completion-{i}.txt').read_text().strip() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(pieces, validate=True))
          assert len(patch) == 91107
          assert hashlib.sha256(patch).hexdigest() == 'bdc0c335a03f3ed4e79aa63457dc284e3132e0f26fae66e35a2979f6ef52b298'
          pathlib.Path('reviewed.patch').write_bytes(patch)
          PY
          cd source
          test "$(git rev-parse HEAD^{tree})" = 9dd95b888ef771d5788e630e14bf14616001e6c8
          git apply --check --index ../reviewed.patch
          git apply --index ../reviewed.patch
          test "$(git write-tree)" = 1b8ee4b504105f5c3443a6b6f3a33158966bf592
          git diff --cached --stat
      - name: Store verified Git objects only, without updating any branch
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const repo = process.env.GITHUB_REPOSITORY;
          if (repo !== 'nebrasacademy3-lab/maras') throw new Error('Unexpected repository');
          const git = (...args) => execFileSync('git', args);
          const names = git('diff', '--cached', '--name-only', '-z').toString().split('\0').filter(Boolean);
          const approved = ['.env.example','RAILWAY_VARIABLES.example','components/admin-operations-center.tsx','docs/GEMINI_PROJECT_ADMISSION_2026_09_19_AR.md','docs/GEMINI_REFRESH_OPERATIONS_2026_09_19_AR.md','mobile/src/components/AdminCenters.tsx','scripts/qa-gemini-refresh.ts','scripts/qa-platform-browser.mjs','tests/operations-access.test.mjs'];
          if (JSON.stringify(names.sort()) !== JSON.stringify(approved.sort())) throw new Error('Unexpected file set');
          const post = async (kind, body) => {
            const response = await fetch(`https://api.github.com/repos/${repo}/git/${kind}`, {method:'POST', headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});
            if (!response.ok) throw new Error(`Git ${kind}: HTTP ${response.status}`);
            return response.json();
          };
          const tree = [];
          for (const path of names) {
            const data = git('show', `:${path}`);
            const expected = createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex');
            const object = await post('blobs', {content:data.toString('base64'),encoding:'base64'});
            if (object.sha !== expected) throw new Error('Blob mismatch');
            tree.push({path,mode:'100644',type:'blob',sha:expected});
          }
          const final = await post('trees', {base_tree:'9dd95b888ef771d5788e630e14bf14616001e6c8',tree});
          if (final.sha !== '1b8ee4b504105f5c3443a6b6f3a33158966bf592') throw new Error('Final source mismatch');
          console.log(JSON.stringify({tree:final.sha,verifiedFiles:names.length,updatedRefs:0}));
          JS
