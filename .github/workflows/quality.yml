name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web lint, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: maras_qa
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: maras_qa
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U maras_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://maras-qa.example
      SEO_TEST_ORIGIN: https://maras-qa.example
      SEO_INDEXING_ENABLED: "true"
      MARAS_LOOPBACK_QA: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint web
        run: npm run lint
      - name: Build production web
        run: npm run build
      - name: Run contracts and smoke tests
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Install isolated browser engines
        run: node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Verify platform security and responsive interfaces
        env:
          QA_DATABASE_URL: postgresql://maras_qa:synthetic-ci-only@127.0.0.1:55439/maras_qa
          QA_BROWSERS: chromium,firefox,webkit
        run: node scripts/qa-study-ci.mjs
      - name: Keep non-secret visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-visual-qa
          path: |
            .data/study-browser/
            .data/platform-browser/
            .data/study-server.log
            .data/study-worker.log
          retention-days: 7

  mobile:
    name: Mobile typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck app
        run: npm run typecheck
      - name: Lint app
        run: npm run lint
      - name: Test app behavior
        run: npm test
