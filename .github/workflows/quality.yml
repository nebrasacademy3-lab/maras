name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          APP_URL: https://marasalelm.com
      - run: npm run typecheck
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: npm audit --omit=dev --audit-level=high
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx expo-doctor
      - run: npx expo export --platform all
        env:
          EXPO_PUBLIC_API_URL: https://marasalelm.com
          EXPO_PUBLIC_STORE_MODE: reader
