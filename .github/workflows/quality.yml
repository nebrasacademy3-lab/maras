name: Quality gates

on:
  pull_request:
  push:
    branches: [main, implement/plan-v7-20260916]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web lint, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: maras_qa
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: maras_qa
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U maras_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://maras-qa.example
      SEO_TEST_ORIGIN: https://maras-qa.example
      SEO_INDEXING_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify committed source and shared contracts
        run: node scripts/verify-source-integrity.mjs
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint web
        run: npm run lint
      - name: Build production web
        run: npm run build
      - name: Run contracts and smoke tests
        run: |
          set +e
          node --test --test-concurrency=1 tests/*.test.mjs > "$RUNNER_TEMP/meras-web-tests.log" 2>&1
          result=$?
          set -e
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms)|^not ok|^[[:space:]]+(error:|code:|expected:|actual:|location:)' "$RUNNER_TEMP/meras-web-tests.log" || true
          exit "$result"
      - name: Verify source was not rewritten by tests
        if: always()
        run: node scripts/verify-source-integrity.mjs
      - name: Install isolated browser engines
        run: node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Install private-media test tooling
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Verify platform security and responsive interfaces
        env:
          QA_DATABASE_URL: postgresql://maras_qa:synthetic-ci-only@127.0.0.1:55439/maras_qa
          QA_BROWSERS: chromium,firefox,webkit
        run: node scripts/qa-study-ci.mjs
      - name: Keep non-secret visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-visual-qa
          path: |
            .data/study-browser/
            .data/platform-browser/
            .data/qa-device-return-report.json
            .data/qa-supervisor-scope-report.json
            .data/qa-email-change-results.json
            .data/qa-order-ownership-report.json
            .data/qa-order-ownership-migration-report.json
            .data/protected-video/report.json
            .data/protected-video/real-playback.png
          include-hidden-files: true
          retention-days: 7

  mobile:
    name: Mobile typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck app
        run: npm run typecheck
      - name: Lint app
        run: npm run lint
      - name: Test app behavior
        run: npm test
