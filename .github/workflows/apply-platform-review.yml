name: Apply verified platform review
on:
  push:
    branches: [improve/platform-security-design-20260915]
    paths: [.github/workflows/apply-platform-review.yml]
permissions:
  contents: write
concurrency:
  group: apply-platform-review
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'nebrasacademy3-lab/maras'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify every source delta before applying
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil
          root = pathlib.Path.cwd().resolve()
          packed = base64.b64decode(''.join((root / f'.transfer-platform/{i}.b64').read_text().strip() for i in range(7)), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '268b818c315b7ed9b871fa3e6c28581865b4295ef77ae7376d2c2fb3dff10e38', 'Transport mismatch'
          manifest = json.loads(lzma.decompress(packed))
          assert len(manifest) == 159
          def safe_path(value):
              p = pathlib.PurePosixPath(value)
              assert value and not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] not in ('.git', '.github', '.data', 'node_modules')
              target = root / p
              assert target.resolve().is_relative_to(root)
              return target
          def digest(text):
              return hashlib.sha256(text.encode('utf-8')).hexdigest()
          pending = []
          seen = set()
          for item in manifest:
              target = safe_path(item['p'])
              assert item['p'] not in seen
              seen.add(item['p'])
              source = safe_path(item['b']) if item['b'] else None
              before = source.read_text() if source and source.exists() else ''
              assert digest(before) == item['h'], 'Base changed: ' + item['p']
              if not item['b']:
                  assert not target.exists(), 'New path already exists: ' + item['p']
              lines = before.splitlines(keepends=True)
              for start, end, replacement in reversed(item['e']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              after = ''.join(lines)
              assert digest(after) == item['r'], 'Result mismatch: ' + item['p']
              pending.append((target, after))
          for target, after in pending:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(after)
              print('VERIFIED', target.relative_to(root))
          # Formatting-only cleanup of the two whitespace lines found by diff --check.
          for name in ('app/api/mobile/auth/login/route.ts', 'mobile/app/admin.tsx'):
              target = root / name
              target.write_text(''.join(line.rstrip(' \t\r\n') + '\n' for line in target.read_text().splitlines(keepends=True)))
          shutil.rmtree(root / '.transfer-platform')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'feat: protected owner and scoped staff, student MFA, referral repairs and platform design'
          git push origin HEAD:improve/platform-security-design-20260915
          git rev-parse HEAD
