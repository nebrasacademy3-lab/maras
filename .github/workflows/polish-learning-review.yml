name: Apply reviewed responsive learning polish
on:
  push:
    branches: [improve/learning-tools-20260915]
    paths: [.github/workflows/polish-learning-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified application changes
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          data = gzip.decompress(base64.b64decode('', validate=True))
          assert hashlib.sha256(data).hexdigest() == '083b677b2711a13919a44eaaef823a72e7861ae17540aebde78246911c2e98ed'
          root = pathlib.Path.cwd().resolve()
          allowed = {'components/learning-room.tsx', 'components/study-tools.module.css', 'mobile/src/components/study-file-tools.tsx', 'app/globals.css', 'scripts/qa-study-browser.mjs'}
          manifest = json.loads(data)
          assert {item['path'] for item in manifest} == allowed
          for item in manifest:
              path = root / item['path']
              assert path.resolve().is_relative_to(root)
              before = path.read_text()
              assert hashlib.sha256(before.encode()).hexdigest() == item['before'], item['path']
              lines = before.splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              after = ''.join(lines)
              assert hashlib.sha256(after.encode()).hexdigest() == item['after'], item['path']
              path.write_text(after)
              print('VERIFIED', item['path'])
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/learning-room.tsx components/study-tools.module.css mobile/src/components/study-file-tools.tsx app/globals.css scripts/qa-study-browser.mjs
          git commit -m 'fix: keep mobile lesson content visible and improve learning navigation legibility'
          git push origin HEAD:improve/learning-tools-20260915
