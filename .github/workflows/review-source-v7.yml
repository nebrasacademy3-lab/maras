name: Plan v7 isolated source snapshot
on:
  push:
    branches: [implement/plan-v7-20260916]
    paths: [.github/workflows/review-source-v7.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/v7-snapshot
          git archive HEAD | gzip > /tmp/v7-snapshot/source.tar.gz
          git rev-parse HEAD > /tmp/v7-snapshot/source-commit.txt
      - name: Install web dependencies in isolated runner
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive web dependencies
        run: tar -czf /tmp/v7-snapshot/web-deps.tar.gz node_modules
      - name: Install native dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive native dependencies
        working-directory: mobile
        run: tar -czf /tmp/v7-snapshot/mobile-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: plan-v7-review-runtime
          path: /tmp/v7-snapshot/
          retention-days: 2
