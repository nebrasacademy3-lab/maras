name: Reviewed refund ownership tree
on:
  push:
    branches: [integration/v7-on-main-20260919]
    paths: [.github/workflows/refund-review-tree.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify literal edits and hashes; create Git objects without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess, urllib.request
          encoded = ''
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded, validate=True))) as stream:
              raw = stream.read(20001)
          assert len(raw) == 15737 and hashlib.sha256(raw).hexdigest() == 'ecfeea9a8283fe68352dab95d15635a04554bebc95387160d4e5048703a89701'
          m = json.loads(raw)
          assert m['base'] == '918153b221c39d08e2a13068f6b30c417e5813df'
          assert m['baseTree'] == '3d5766cf8de2e21bd7261e3a7dbdcc39eff59a11' and m['tree'] == '5b1c596c75adc69de7f8b3b2529614555628ffed'
          allowed = {'app/api/webhooks/tap/route.ts','lib/refunded-order-access.ts','lib/refunds.ts','scripts/qa-admin-stable-ownership.ts','tests/business-services-behavior.test.mjs','tests/refund-stable-ownership-behavior.test.mjs','tests/seo-discovery-behavior.test.mjs'}
          assert len(m['files']) == 7 and {f['path'] for f in m['files']} == allowed
          subprocess.run(['git','merge-base','--is-ancestor',m['base'],'HEAD'],check=True)
          subprocess.run(['git','read-tree','--reset','-u',m['base']],check=True)
          for f in m['files']:
              p = pathlib.Path(f['path']); old = p.read_bytes() if p.exists() else b''
              assert not p.is_symlink()
              assert (hashlib.sha256(old).hexdigest() if p.exists() else None) == f['before']
              lines = old.decode().splitlines(keepends=True)
              for h in reversed(f['hunks']):
                  assert 0 <= h['start'] <= h['end'] <= len(lines)
                  lines[h['start']:h['end']] = h['lines']
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == f['after']
              p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(new)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == m['tree']
          def post(endpoint,payload):
              assert endpoint in ('blobs','trees')
              req = urllib.request.Request('https://api.github.com/repos/nebrasacademy3-lab/maras/git/'+endpoint,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          entries=[]
          for f in m['files']:
              content=pathlib.Path(f['path']).read_bytes()
              sha=post('blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})['sha']
              assert sha == subprocess.check_output(['git','hash-object',f['path']],text=True).strip()
              entries.append({'path':f['path'],'mode':'100644','type':'blob','sha':sha})
          tree=post('trees',{'base_tree':m['baseTree'],'tree':entries})['sha']
          assert tree == m['tree']
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'refund-review'; evidence.mkdir()
          (evidence/'manifest.json').write_bytes(raw)
          (evidence/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached',m['base'],'--']))
          (evidence/'tree.json').write_text(json.dumps({'tree':tree,'files':entries,'updatedRefs':False},indent=2))
          print('VERIFIED_UNATTACHED_TREE',tree)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-refund-tree
          path: ${{ runner.temp }}/refund-review/
          retention-days: 3
          if-no-files-found: error
