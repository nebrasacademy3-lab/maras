name: Apply verified learning tools
on:
  push:
    branches: [improve/learning-tools-20260915]
    paths: [.github/workflows/apply-learning-tools.yml]
permissions:
  contents: write
concurrency:
  group: apply-learning-tools
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and apply reviewed source delta
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil
          root = pathlib.Path.cwd().resolve()
          chunks = [pathlib.Path(f'.transfer/{i}.b64').read_text().strip() for i in range(5)]
          packed = base64.b64decode(''.join(chunks), validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'bc2399df1da3621b56fe303a740c9438fd0adcc949c91542a8b29fbae0c2465e', 'Transport checksum mismatch'
          manifest = json.loads(lzma.decompress(packed))
          def safe_path(value):
              p = pathlib.PurePosixPath(value)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] not in ('.git', '.data', 'node_modules'), value
              target = root / p
              assert target.resolve().is_relative_to(root), value
              return target
          def digest(value):
              return hashlib.sha256(value.encode('utf-8')).hexdigest()
          assert len(manifest) == 71
          for item in manifest:
              target = safe_path(item['path'])
              source = safe_path(item['base']) if item['base'] else None
              before = source.read_text() if source and source.exists() else ''
              assert digest(before) == item['before'], 'Base changed: ' + item['path']
              lines = before.splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              after = ''.join(lines)
              assert digest(after) == item['after'], 'Result mismatch: ' + item['path']
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(after)
              print('VERIFIED', item['path'])
          shutil.rmtree('.transfer')
          for name in ('source-snapshot.yml', 'isolated-toolchain.yml', 'apply-learning-tools.yml'):
              pathlib.Path('.github/workflows', name).unlink(missing_ok=True)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: lesson-linked study tools, durable AI queue, branded exports and web/mobile learning UX'
          git push origin HEAD:improve/learning-tools-20260915
          git rev-parse HEAD
