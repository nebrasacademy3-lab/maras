name: Pinned continuation source f8413f0
on:
  push:
    branches: [audit/source-f8413f0]
    paths: [.github/workflows/review-source-f8413f0.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f8413f0badac273ed6f68dbff0d8a8c02184a302
          persist-credentials: false
      - name: Export tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f8413f0badac273ed6f68dbff0d8a8c02184a302
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-source-f8413f0
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-identity.txt
          retention-days: 1
          if-no-files-found: error
