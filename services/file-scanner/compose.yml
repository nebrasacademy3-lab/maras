services:
  scanner:
    build: .
    environment:
      MALWARE_SCAN_TOKEN: ${MALWARE_SCAN_TOKEN:?Set a strong shared token}
      CLAMD_HOST: clamav
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - clamav
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
  clamav:
    image: clamav/clamav:stable
    volumes:
      - signatures:/var/lib/clamav
    restart: unless-stopped
    # No public TCP port: clamd has no HTTP authentication of its own.
volumes:
  signatures:
